<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes | Gestión Comercial</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #1e293b; }
        .container { background: #ffffff; border-radius: 10px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); width: 100%; max-width: 480px; overflow: hidden; border: 1px solid #e2e8f0; }
        .header { background-color: #0f172a; color: #ffffff; padding: 22px 30px; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; }
        .header p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
        .form-body { padding: 28px 30px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; color: #334155; margin-bottom: 6px; font-size: 13px; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; color: #0f172a; transition: border-color 0.2s, box-shadow 0.2s; }
        input[type="text"] { text-transform: capitalize; }
        input:focus { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); outline: none; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #94a3b8; border-radius: 6px; background-color: #f8fafc; font-size: 13px; color: #475569; cursor: pointer; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        button { flex: 2; padding: 12px; background-color: #1e3a8a; border: none; border-radius: 6px; color: #ffffff; font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #172554; }
        .btn-back { flex: 1; padding: 12px; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; transition: background-color 0.2s; }
        .btn-back:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Registro de Clientes</h2>
            <p>Datos del Cliente</p>
        </div>
        <div class="form-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Nombre(s) </label>
                    <input type="text" name="nombre_cliente" placeholder="" oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())" required>
                </div>
                <div class="form-group">
                    <label>Apellido Paterno </label>
                    <input type="text" name="ap_cliente" placeholder="" oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())" required>
                </div>
                <div class="form-group">
                    <label>Apellido Materno</label>
                    <input type="text" name="am_cliente" placeholder="" oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())">
                </div>
                <div class="form-group">
                    <label>Numero de Teléfono</label>
                    <input type="tel" name="telefono" placeholder="">
                </div>
                <div class="form-group">
                    <label>Fotografía del Empleado</label>
                    <input type="file" name="foto_c" accept="image/*">
                </div>
                <div class="actions">
                    <a href="/" class="btn-back">Cancelar</a>
                    <button type="submit">Registrar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
