<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota de Venta | Gestión Comercial</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #1e293b; }
        .container { background: #ffffff; border-radius: 10px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); width: 100%; max-width: 720px; overflow: hidden; border: 1px solid #e2e8f0; }
        .header { background-color: #0f172a; color: #ffffff; padding: 22px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; }
        .header p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
        .form-body { padding: 28px 30px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }
        label { display: block; font-weight: 600; color: #334155; margin-bottom: 6px; font-size: 13px; }
        select, input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; color: #0f172a; background-color: #ffffff; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: #1e3a8a; outline: none; }
        
        .fila-producto { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .btn-agregar { padding: 10px 18px; background-color: #0f766e; border: none; border-radius: 6px; color: #ffffff; font-weight: 600; font-size: 14px; cursor: pointer; height: 40px; white-space: nowrap; transition: background-color 0.2s; }
        .btn-agregar:hover { background-color: #115e59; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 12px; text-align: left; }
        th { background-color: #f1f5f9; color: #334155; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        .btn-eliminar { background-color: #dc2626; color: #ffffff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-eliminar:hover { background-color: #b91c1c; }
        
        .resumen { background-color: #f8fafc; padding: 18px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-left: 4px solid #1e3a8a; }
        .resumen p { margin: 6px 0; font-size: 14px; color: #334155; display: flex; justify-content: space-between; }
        .resumen .total-row { font-size: 18px; font-weight: 700; color: #0f172a; border-top: 1px solid #cbd5e1; padding-top: 10px; margin-top: 10px; }
        .descuento-alerta { color: #0f766e !important; font-weight: 600; font-size: 13px !important; }

        .actions { display: flex; gap: 12px; margin-top: 20px; }
        button[type="submit"] { flex: 2; padding: 12px; background-color: #1e3a8a; border: none; border-radius: 6px; color: #ffffff; font-weight: 600; font-size: 15px; cursor: pointer; transition: background-color 0.2s; }
        button[type="submit"]:hover { background-color: #172554; }
        .btn-back { flex: 1; padding: 12px; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; }
        .btn-back:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>Recibo de Compra</h2>
                <p>Ticket de Venta y Cobro de Productos</p>
            </div>
        </div>
        <div class="form-body">
            <form method="POST" id="form-venta">
                <div class="grid-3">
                    <div>
                        <label>Cliente </label>
                        <select name="id_cliente" required>
                            {% for c in clientes %}
                                <option value="{{ c._id }}">{{ c.nombre_cliente }} {{ c.ap_cliente }} {{ c.am_cliente }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label>Cajero </label>
                        <select name="id_cajero" required>
                            {% for caj in cajeros %}
                                <option value="{{ caj._id }}">{{ caj.nombre_cajero }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label>Fecha </label>
                        <input type="date" name="fecha_vta" id="fecha-hoy" required>
                    </div>
                </div>

                <div class="fila-producto">
                    <div style="flex: 3;">
                        <label>Seleccionar Producto</label>
                        <select id="select-producto">
                            {% for p in productos %}
                                <option value="{{ p._id }}" data-nombre="{{ p.nombre_producto }}" data-precio="{{ p.precio }}">
                                    {{ p.nombre_producto }} — ${{ "%.2f"|format(p.precio) }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>Cantidad</label>
                        <input type="number" id="input-cantidad" value="1" min="1">
                    </div>
                    <button type="button" class="btn-agregar" onclick="agregarAlCarrito()">+ Agregar al Carrito</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Precio Unit.</th>
                            <th>Cant.</th>
                            <th>Total</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-carrito">
                        <tr><td colspan="5" style="text-align:center; color:#64748b; padding: 20px;">No hay artículos agregados a la nota</td></tr>
                    </tbody>
                </table>

                <div class="resumen">
                    <p><span>Subtotal:</span> <span>$<span id="txt-subtotal">0.00</span></span></p>
                    <p id="msg-descuento" class="descuento-alerta" style="display:none;"><span>Bonificación del 5% aplicada (Compra &ge; $5,000)</span></p>
                    <p><span>Descuento aplicado:</span> <span>-$<span id="txt-descuento">0.00</span></span></p>
                    <p class="total-row"><span>Total a Pagar:</span> <span>$<span id="txt-total">0.00</span></span></p>
                </div>

                <div>
                    <label>Efectivo Recibido (MXN) </label>
                    <input type="number" step="0.01" name="billete_pago" placeholder="" min="0" required>
                </div>

                <input type="hidden" name="carrito_json" id="carrito-json">

                <div class="actions">
                    <a href="/" class="btn-back">Volver al Menú</a>
                    <button type="submit">Pagar y recibir Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('fecha-hoy').valueAsDate = new Date();

        let carrito = [];
        const META_DESCUENTO = 5000;
        const PORCENTAJE_META = 5;

        function agregarAlCarrito() {
            const select = document.getElementById('select-producto');
            if (select.options.length === 0) return;

            const option = select.options[select.selectedIndex];
            const id = option.value;
            const nombre = option.getAttribute('data-nombre');
            const precio = parseFloat(option.getAttribute('data-precio'));
            const cantidad = parseInt(document.getElementById('input-cantidad').value);

            if (isNaN(cantidad) || cantidad <= 0) {
                alert("Ingrese una cantidad válida.");
                return;
            }

            const existente = carrito.find(item => item.id === id);
            if (existente) {
                existente.cantidad += cantidad;
                existente.importe = existente.precio * existente.cantidad;
            } else {
                carrito.push({
                    id: id,
                    nombre: nombre,
                    precio: precio,
                    cantidad: cantidad,
                    importe: precio * cantidad
                });
            }

            document.getElementById('input-cantidad').value = 1;
            renderizarCarrito();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById('tabla-carrito');
            tbody.innerHTML = '';

            if (carrito.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b; padding: 20px;">No hay artículos agregados a la nota</td></tr>';
            } else {
                carrito.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.nombre}</td>
                            <td>$${item.precio.toFixed(2)}</td>
                            <td>${item.cantidad}</td>
                            <td>$${item.importe.toFixed(2)}</td>
                            <td><button type="button" class="btn-eliminar" onclick="eliminarDelCarrito(${index})">Quitar</button></td>
                        </tr>
                    `;
                });
            }
            actualizarTotales();
        }

        function actualizarTotales() {
            const subtotal = carrito.reduce((acc, item) => acc + item.importe, 0);
            let porcentajeBonificacion = 0;
            const msgDescuento = document.getElementById('msg-descuento');

            if (subtotal >= META_DESCUENTO) {
                porcentajeBonificacion = PORCENTAJE_META;
                msgDescuento.style.display = 'flex';
            } else {
                msgDescuento.style.display = 'none';
            }

            const montoDescuento = subtotal * (porcentajeBonificacion / 100);
            const total = Math.max(0, subtotal - montoDescuento);

            document.getElementById('txt-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('txt-descuento').innerText = montoDescuento.toFixed(2);
            document.getElementById('txt-total').innerText = total.toFixed(2);
            document.getElementById('carrito-json').value = JSON.stringify(carrito);
        }

        document.getElementById('form-venta').addEventListener('submit', function(e) {
            if (carrito.length === 0) {
                e.preventDefault();
                alert("Debe agregar al menos un producto antes de emitir el ticket.");
            }
        });
    </script>
</body>
</html>
